services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: vmaas
      POSTGRES_USER: vmaas
      POSTGRES_PASSWORD: vmaas_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/V001__initial_schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./docker/postgres-init/002-seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmaas -d vmaas"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://vmaas:vmaas_dev_password@postgres:5432/vmaas
      COMPUTE_PROVIDER: ${COMPUTE_PROVIDER:-mock}
      PORT: 8080
    ports:
      - "8080:8080"
      - "3000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/vmaas-worker"]
    environment:
      DATABASE_URL: postgresql://vmaas:vmaas_dev_password@postgres:5432/vmaas
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      COMPUTE_PROVIDER: ${COMPUTE_PROVIDER:-mock}
      PROVISIONING_TIMEOUT_SECONDS: ${PROVISIONING_TIMEOUT_SECONDS:-180}
      OPENSTACK_AUTH_URL: ${OPENSTACK_AUTH_URL:-}
      OPENSTACK_USERNAME: ${OPENSTACK_USERNAME:-}
      OPENSTACK_PASSWORD: ${OPENSTACK_PASSWORD:-}
      OPENSTACK_USER_DOMAIN: ${OPENSTACK_USER_DOMAIN:-Default}
      OPENSTACK_PROJECT_NAME: ${OPENSTACK_PROJECT_NAME:-}
      OPENSTACK_PROJECT_ID: ${OPENSTACK_PROJECT_ID:-}
      OPENSTACK_PROJECT_DOMAIN: ${OPENSTACK_PROJECT_DOMAIN:-Default}
      OPENSTACK_REGION: ${OPENSTACK_REGION:-RegionOne}
      OPENSTACK_INTERFACE: ${OPENSTACK_INTERFACE:-public}
      OPENSTACK_NETWORK_ID: ${OPENSTACK_NETWORK_ID:-}
      OPENSTACK_IMAGE_ID: ${OPENSTACK_IMAGE_ID:-}
      OPENSTACK_KEY_NAME: ${OPENSTACK_KEY_NAME:-}
      OPENSTACK_FLAVOR_ID_SMALL: ${OPENSTACK_FLAVOR_ID_SMALL:-}
      OPENSTACK_FLAVOR_ID_MEDIUM: ${OPENSTACK_FLAVOR_ID_MEDIUM:-}
      OPENSTACK_FLAVOR_ID_LARGE: ${OPENSTACK_FLAVOR_ID_LARGE:-}
      OPENSTACK_FLAVOR_ID_COMPUTE: ${OPENSTACK_FLAVOR_ID_COMPUTE:-}
      OPENSTACK_FLAVOR_ID_MEMORY: ${OPENSTACK_FLAVOR_ID_MEMORY:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
